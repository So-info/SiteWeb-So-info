<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Merci pour votre achat – SO INFO</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #080808;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    .card {
      width: 100%;
      max-width: 620px;
      padding: 55px 30px;
      border: 1px solid #c9a23f;
      background: #111;
      box-shadow: 0 0 35px #c9a23f22;
    }
    .logo {
      color: #d8b454;
      font-size: 32px;
      font-weight: bold;
      letter-spacing: 7px;
    }
    .check {
      margin: 30px auto;
      width: 65px;
      height: 65px;
      border: 2px solid #d8b454;
      border-radius: 50%;
      color: #d8b454;
      font-size: 42px;
      line-height: 61px;
    }
    h1 { color: #d8b454; font-size: 27px; }
    p { line-height: 1.7; color: #ddd; }
    a {
      display: inline-block;
      margin-top: 25px;
      padding: 14px 25px;
      background: #d8b454;
      color: #080808;
      text-decoration: none;
      font-weight: bold;
    }
    .small { color: #aaa; font-size: 13px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">SO INFO</div>
    <div class="check">✓</div>
    <h1>Merci pour votre commande !</h1>
    <p>Votre paiement a été transmis.</p>
    <p>
      Votre carte cadeau numérique SO INFO sera envoyée
      par e-mail après confirmation du paiement.
    </p>
    <p>Pensez à vérifier vos courriers indésirables.</p>
    <a href="/">Retour sur SO INFO</a>
    <p class="small">Une question ? contact@so-info.fr</p>
  </main>
</body>
</html>
